<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Setoran Uang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Admin Setoran</h1>
      <p>Kelola data setoran</p>
    </div>
    <a class="admin-link" href="index.html">← Kembali</a>
  </header>

  <main class="container">
    <section id="loginCard" class="card narrow">
      <h2>Login Admin</h2>
      <p class="muted">Gunakan akun admin Firebase Authentication.</p>
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="admin@email.com">
        <label for="password">Password</label>
        <input id="password" type="password" required placeholder="Password">
        <button type="submit">Masuk</button>
        <p id="loginMessage" class="message"></p>
      </form>
    </section>

    <section id="adminPanel" class="hidden">
      <div class="admin-actions">
        <div>
          <h2>Data Setoran</h2>
          <p id="adminEmail" class="muted"></p>
        </div>
        <button id="logoutBtn" class="secondary">Keluar</button>
      </div>

      <section class="stats">
        <div class="stat-card">
          <span>Total Setoran</span>
          <strong id="adminTotal">Rp0</strong>
        </div>
        <div class="stat-card">
          <span>Jumlah Transaksi</span>
          <strong id="adminCount">0</strong>
        </div>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>Daftar Setoran</h2>
          <input id="adminSearch" class="search" type="search" placeholder="Cari nama...">
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Nama</th>
                <th>Nominal</th>
                <th>Keterangan</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="adminTable">
              <tr><td colspan="5" class="empty">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
